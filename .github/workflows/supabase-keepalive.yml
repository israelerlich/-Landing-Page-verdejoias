name: Mantem o Supabase acordado

# O projeto e free tier e pausa sozinho apos ~7 dias sem atividade.
# Quando isso acontece o formulario das landings falha em silencio e o lead some.
# Este job faz uma leitura na API todo dia, o que conta como atividade.

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT, todo dia
  workflow_dispatch:        # permite rodar na mao pelo site do GitHub

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Le um registro da tabela leads
        run: |
          # Chave publishable: ja fica exposta no HTML das landings, nao e segredo.
          codigo=$(curl -s -o /tmp/resposta.txt -w '%{http_code}' \
            -H 'apikey: sb_publishable_4W6Bdfle6nEl8Q-SoBn1vw_cD64bp9z' \
            'https://ineqsoqfhqzuonvyyxxb.supabase.co/rest/v1/leads?select=id&limit=1')

          echo "HTTP $codigo"
          cat /tmp/resposta.txt

          if [ "$codigo" != "200" ]; then
            echo "::error::Supabase respondeu $codigo. Se for 521, o projeto esta pausado e os leads estao se perdendo."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Registra o ping (so as segundas, pra nao poluir o historico)
        run: |
          # O GitHub desliga workflows agendados apos 60 dias sem commit no repo.
          # Um commit por semana mantem o agendamento vivo.
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Hoje nao e segunda, pulando o commit."
            exit 0
          fi

          date -u +'Ultimo ping: %Y-%m-%d %H:%M UTC' > .github/ultimo-ping.txt

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/ultimo-ping.txt

          git diff --staged --quiet && { echo "Nada mudou."; exit 0; }

          git commit -m 'chore: ping semanal do Supabase'
          git push
